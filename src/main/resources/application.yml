spring:
  application:
    name: batch-log-system

    # 資料庫配置
  datasource:
    # PostgreSQL 資料庫配置
    url: jdbc:postgresql://192.168.31.247:5444/postgres?useUnicode=true&characterEncoding=utf8&useSSL=false&currentSchema=public
    username: root
    password: VZq9rWbC3oJYFYdDrjT6edewVHQEKNCBWPDnyqxKyzMTE3CoozBrWnYsi6KkpwKujcFKDytQCrxhTbcxsAB2vswcVgQc9ieYvtpP
    driver-class-name: org.postgresql.Driver
    
    # HikariCP 連接池配置 - 關鍵修復
    hikari:
      # 連接池大小設置
      maximum-pool-size: 20          # 最大連接數（原本可能是10）
      minimum-idle: 5                # 最小空閒連接數
      
      # 超時設置
      connection-timeout: 20000      # 連接超時 20 秒
      idle-timeout: 300000           # 空閒超時 5 分鐘
      max-lifetime: 1200000          # 連接最大生命週期 20 分鐘
      
      # 驗證設置
      validation-timeout: 3000       # 驗證超時 3 秒
      connection-test-query: SELECT 1
      
      # 洩漏檢測
      leak-detection-threshold: 60000  # 60 秒洩漏檢測
      
      # 連接池名稱
      pool-name: BatchLogHikariPool

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Spring Batch 配置
  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:org/springframework/batch/core/schema-postgresql.sql
    job:
      enabled: false # 防止應用啟動時自動執行批次作業

# 應用程式自定義配置
filePath: test-files/ftppool
backupPath: test-files/ftppool/Backup

# 日誌相關配置
logging:
  level:
    cub.ret.tru: DEBUG
    org.springframework.batch: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 伺服器配置
server:
  port: 8089

# 管理端點配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,batch
  endpoint:
    health:
      show-details: always
